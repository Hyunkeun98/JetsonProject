# NX5 데모 라인: 서보 3축(AxX, AxZ, AxCV)의 속도(Vel)와 토크(Trq)만 입력과 점수에 쓴다.
# 위치(Pos), ProcStart, TaktTime은 쓰지 않는다.
equipment_id: nx5
mqtt:
  subscribe_topics:
  - dx1/AxisData
  publish_topic: jetson/nx5/anomaly
  command_topic: jetson/nx5/cmd
groups:
  axis_x:
    tags:
    - NX5_AxisData:AxX_Act_Vel
    - NX5_AxisData:AxX_Act_Trq
  axis_z:
    tags:
    - NX5_AxisData:AxZ_Act_Vel
    - NX5_AxisData:AxZ_Act_Trq
  axis_cv:
    tags:
    - NX5_AxisData:AxCV_Act_Vel
    - NX5_AxisData:AxCV_Act_Trq
resample_interval_ms: 100
max_lateness_ms: 500
window_size: 30
calibration:
  max_duration: 7d
  min_samples: 3000
training:
  max_samples: 45000
  epochs: 20
