[project]
name = "jetson-app"
version = "0.1.0"
description = "DX1 -> Jetson MQTT telemetry subscriber (communication layer)"
readme = "README.md"
authors = [
    { name = "Hyunkeun98", email = "202945727+Hyunkeun98@users.noreply.github.com" }
]
requires-python = ">=3.8"
dependencies = [
    "paho-mqtt<2",
    "pyyaml>=6.0.3",
    "torch<2.4",
]

[project.optional-dependencies]
# 설정 생성 도구(jetson-datalist)가 엑셀을 읽을 때만 필요하다. 런타임(Jetson)에는 불필요.
tools = ["openpyxl>=3.1"]

[project.scripts]
jetson-app = "jetson_app.subscriber_cli:main"
jetson-datalist = "jetson_app.datalist_to_config:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7,<8",
    "openpyxl>=3.1",
]
